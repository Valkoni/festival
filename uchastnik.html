<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Стани участник - Училището има талант</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header>
    <h2 class="logo">Училището има талант</h2>
    <p class="slogan">Покажи какво можеш!</p>
    <nav>
      <a href="festival.html">Начало</a>
      <a href="festival.html#programa">Програма</a>
      <a href="festival.html#kontakti">Контакти</a>
    </nav>
  </header>
 
  <main>
    <h1>Стани участник!</h1>
    <p>Попълни формата и ще се свържем с теб.</p>
 
    <form action="#" method="post" class="forma">
 
      <label for="imena">Имена:</label>
      <input type="text" id="imena" name="imena" required>
 
      <label for="email">Имейл:</label>
      <input type="email" id="email" name="email" required>
 
      <label for="telefon">Телефон:</label>
      <input type="tel" id="telefon" name="telefon">
 
      <label for="klas">Клас:</label>
      <input type="text" id="klas" name="klas">
 
      <label for="talant">С какво ще се представиш?</label>
      <select id="talant" name="talant">
        <option>Музика</option>
        <option>Танци</option>
        <option>Рисуване</option>
        <option>Проект</option>
        <option>Спорт</option>
        <option>Друго</option>
      </select>
 
      <label for="info">Други данни / пожелания:</label>
      <textarea id="info" name="info" rows="4"></textarea>
 
      <button type="submit" class="btn-uchastnik">Изпрати</button>
    </form>
 
    <p><a href="festival.html">&larr; Обратно към фестивала</a></p>
  </main>
 
  <footer>
    <p>ОУ „Св. Св. Кирил и Методий“ &copy; 2026</p>
  </footer>
 
</body>
</html>
